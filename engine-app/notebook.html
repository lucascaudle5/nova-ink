<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="nova-asset-origin" content="__NOVA_ASSET_ORIGIN__" />
    <title>NOVA Ink</title>
  </head>
  <body>
    <main id="surface"></main>

    <nav class="pagesbar floating" aria-label="Notebook">
      <button id="library-button" title="Library" aria-label="Library">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
      </button>
      <button id="pages-button" class="pages-button" title="Pages" aria-label="Pages" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" /></svg>
        <span id="page-title" class="page-title">NOVA Ink</span>
      </button>
      <button id="prev-page" title="Previous page" aria-label="Previous page">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button id="next-page" title="Next page" aria-label="Next page">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    </nav>

    <nav id="rail" class="rail floating" aria-label="Drawing tools">
      <button data-tool="pen" class="tool active pen-tool" title="Pen (tap again for width and color)" aria-label="Pen" data-popover-anchor>
        <svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
        <span id="pen-dot" class="pen-dot"></span>
      </button>
      <button data-tool="eraser" class="tool" title="Eraser (tap again for size and mode)" aria-label="Eraser" data-popover-anchor>
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></svg>
      </button>
      <button data-tool="select" class="tool" title="Select: draw around ink or pictures, then move, resize, turn, copy or recolor them (tap again for loop or box)" aria-label="Select" data-popover-anchor>
        <svg viewBox="0 0 24 24"><path d="M4 3l7 17 2.5-7.5L21 10z" /></svg>
      </button>
      <button data-tool="snip" class="tool" title="Snip: drag a rectangle over the part of the page you want to show NOVA" aria-label="Snip an area">
        <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14" /><path d="M18 22V8a2 2 0 0 0-2-2H2" /></svg>
      </button>
      <span class="sep"></span>
      <button id="undo" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
      </button>
      <button id="redo" title="Redo" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
      </button>
      <span class="sep"></span>
      <button id="rail-collapse" title="Hide the tools" aria-label="Hide the tools">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
    </nav>

    <nav id="rail-handle" class="rail floating" aria-label="Show the tools" hidden>
      <button id="rail-expand" title="Show the tools" aria-label="Show the tools">
        <svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
      </button>
    </nav>

    <div id="pen-flyout" class="pen-flyout panel" hidden role="group" aria-label="Pen width and color">
      <div class="fly-label">Width</div>
      <span id="width-slots" class="slots" title="Tap a width to use it; tap it again to change it." data-popover-anchor></span>
      <div class="fly-label">Color</div>
      <span id="color-slots" class="slots" title="Tap a color to use it; tap it again to change it." data-popover-anchor></span>
    </div>

    <div id="select-flyout" class="pen-flyout panel" hidden role="group" aria-label="Selection shape">
      <div class="fly-label">Select with</div>
      <div class="segmented two" role="radiogroup" aria-label="Selection shape">
        <button id="shape-loop" role="radio" data-shape="loop" title="Draw a loop around what you want">Loop</button>
        <button id="shape-box" role="radio" data-shape="box" title="Drag a rectangle over what you want">Box</button>
      </div>
    </div>

    <nav class="corner floating" aria-label="View">
      <button id="ask-button" class="ask-button" title="Ask NOVA about what is on screen" aria-label="Ask NOVA">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
        <span>Ask NOVA</span>
      </button>
      <button id="insert-image" title="Insert a picture or PDF" aria-label="Insert a picture or PDF">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="1.8" /><path d="m21 16-5-5-9 9" /></svg>
      </button>
      <input id="image-file" type="file" accept="image/*,application/pdf,.pdf" hidden />
      <button id="page" title="Page style" aria-label="Page style" data-popover-anchor>
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" /><path d="M4 9h16M4 15h16M10 3v18" /></svg>
      </button>
      <button id="menu-button" title="More" aria-label="More" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="19" cy="12" r="1.2" /></svg>
      </button>
    </nav>

    <nav class="zoombar floating" aria-label="Zoom">
      <button id="zoom-out" title="Zoom out (Ctrl −)" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
      </button>
      <button id="zoom-reset" class="zoom-label" title="Zoom to 100% (Ctrl 0)" aria-label="Zoom to 100%">100%</button>
      <button id="zoom-in" title="Zoom in (Ctrl +)" aria-label="Zoom in">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg>
      </button>
      <span class="sep"></span>
      <button id="fit" title="Fit all ink" aria-label="Fit all ink">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
      </button>
    </nav>

    <section id="library" class="library" hidden aria-label="Library">
      <header class="library-bar">
        <span id="library-title" class="library-title"></span>
        <span id="library-actions" class="library-actions"></span>
      </header>
      <div id="library-grid" class="library-grid"></div>
    </section>
    <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>

    <aside id="pages" class="pages panel" hidden aria-label="Pages"></aside>
    <div id="menu" class="menu panel" hidden></div>

    <div id="selection-bar" class="selection-bar floating" hidden>
      <span id="selection-label">Picture selected</span>
      <button id="sel-turn" title="Turn a quarter clockwise (drag the round handle to turn it freely)">Turn 90°</button>
      <button id="sel-duplicate" title="Make a copy of the selection">Copy</button>
      <button id="sel-style" title="Change the color or width of the selected ink" data-popover-anchor>Color</button>
      <button id="sel-ask" title="Ask NOVA about just the selection">Ask NOVA</button>
      <button id="sel-delete" class="danger">Delete</button>
      <button id="sel-done">Done</button>
    </div>

    <div id="snip-bar" class="snip-bar floating panel" hidden>
      <div class="snip-title">Drag a rectangle over the part you want ChatGPT to see</div>
      <div id="snip-levels" class="segmented" role="radiogroup" aria-label="Help level"></div>
      <div id="snip-note" class="snip-note"></div>
      <div class="snip-actions">
        <button id="snip-whole" title="Cover everything on the page">Whole page</button>
        <button id="snip-cancel">Cancel</button>
        <button id="snip-send" class="primary">Send to NOVA</button>
      </div>
      <div id="snip-result" class="ask-result" aria-live="polite"></div>
    </div>

    <footer class="status" aria-live="polite">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Connecting…</span>
      <span id="status-actions" class="actions"></span>
    </footer>

    <div id="preset-editor" class="popover panel" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
